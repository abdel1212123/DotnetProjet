<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotnetProjet</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #e6e9f0;
            --ink: #3d4457;
            --sub: #8890a6;
            --accent: #6c7bff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: 'Quicksand',sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: var(--bg);
            border-radius: 32px;
            padding: 56px 48px;
            max-width: 520px;
            width: 100%;
            box-shadow: 14px 14px 28px #c5c9d4,-14px -14px 28px #ffffff;
        }

        .pill {
            display: inline-block;
            background: var(--bg);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            box-shadow: inset 4px 4px 8px #c5c9d4,inset -4px -4px 8px #ffffff;
            margin-bottom: 22px;
        }

        h1 {
            font-weight: 700;
            font-size: 34px;
            margin: 0 0 12px;
        }

        p {
            color: var(--sub);
            font-size: 15px;
            line-height: 1.6;
            margin: 0 0 32px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border-radius: 18px;
            padding: 18px 22px;
            margin-bottom: 14px;
            text-decoration: none;
            color: var(--ink);
            font-weight: 600;
            box-shadow: 8px 8px 16px #c5c9d4,-8px -8px 16px #ffffff;
            transition: .15s;
        }

            .btn:hover {
                box-shadow: inset 4px 4px 8px #c5c9d4,inset -4px -4px 8px #ffffff;
            }

            .btn span.arrow {
                color: var(--accent);
                font-weight: 700;
            }

        .credit {
            text-align: center;
            color: var(--sub);
            font-size: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #d3d7e2;
        }

            .credit strong {
                color: var(--ink);
                font-weight: 600;
            }
    </style>
</head>
<body>
    <div class="card">
        <span class="pill">ASP.NET CORE</span>
        <h1>DotnetProjet</h1>
        <p>Plateforme de gestion des formations avec un formateur IA integre pour repondre aux questions a l'oral.</p>
        <a class="btn" href="/FormIA.html">Formateur IA <span class="arrow">→</span></a>
        <a class="btn" href="/swagger/index.html">API — Swagger <span class="arrow">→</span></a>
        <div class="credit">Réalisé par <strong>AYATALLAH Abderrahman</strong></div>
    </div>
</body>
</html>
